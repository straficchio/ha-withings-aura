[project]
name = "ha-withings-aura"
version = "0.1.5"
description = "Home Assistant custom integration for the Withings Aura (WSD01)"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio",
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
